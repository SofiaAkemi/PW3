<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos Pessoais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!--Parte para Adicionar os Gastos-->
    <div id="ptAdicionarGastos">
        <h1>Meus Gastos Pessoais</h1>

        <h2>Adicionar Gasto</h2>

        <!--Formulário-->
        <form action="" id="formGasto">
            <table>
                <tr id="adicionarGastoLayout">
                    <td> <!--Descrição do Gasto-->
                        <label>Descrição</label><br>
                        <input type="text" id="desc"><br>
                    </td>
                    <td> <!--Valor do Gasto-->
                        <label>Valor</label><br>
                        <input type="text" id="val" step="0.01"><br>
                    </td>
                    <td> <!--Categoria do Gasto-->
                        <label>Categoria</label><br>
                        <select id="categoria">
                            <option value="alimentacao">Alimentação</option>
                            <option value="lazer">Lazer</option>
                            <option value="transporte">Transporte</option>
                            <option value="saude">Saúde</option>
                            <option value="trabalho">Trabalho</option>
                            <option value="escola">Escola</option>
                            <option value="assinatura">Assinatura</option>
                            <option value="conta">Conta</option>
                            <option value="outro">Outro</option>
                        </select>
                    </td>
                </tr>
            </table>

            <br> <!--Botão para Enviar Formulário-->
            <button type="submit">Adicionar Gasto</button>
        </form>
    </div>

    <hr> <!--Divisão-->

    <!--Parte para Ver o Total Gasto-->
    <div id="ptTotalGasto">
        <h2>Total Gasto</h2>

        <div id="ttl">R$0,00</div>
    </div>

    <hr> <!--Divisão-->

    <!--Parte para Ver Todos os Gastos-->
    <div id="ptListaGastos">
        <h2>Lista de Gastos</h2>

        <!--Filtro-->
        <label>Filtrar por Categoria:</label>
        <select onchange="filtrarGastos(this.value)">
            <option value="todos">Todos</option>
            <option value="alimentacao">Alimentação</option>
            <option value="lazer">Lazer</option>
            <option value="transporte">Transporte</option>
            <option value="saude">Saúde</option>
            <option value="trabalho">Trabalho</option>
            <option value="escola">Escola</option>
            <option value="assinatura">Assinatura</option>
            <option value="conta">Conta</option>
            <option value="outro">Outro</option>
        </select>

        <!--Lista-->
        <div id="gastosLayout"></div>
    </div>

    <!--Conexão com o Script-->
    <script src="script.js"></script>
</body>
</html>
