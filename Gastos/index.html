<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos Pessoais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container1">
        <h1>Meus Gastos Pessoais</h1>

        <h2>Adicionar Gasto</h2>

        <form action="" id="formGasto">
            <table>
                <tr id="adicionarGastoLayout">
                    <td>
                        <label>Descrição</label><br>
                        <input type="text" id="desc"><br>
                    </td>
                    <td>
                        <label>Valor</label><br>
                        <input type="number" id="val"><br>
                    </td>
                    <td>
                        <label>Categoria</label><br>
                        <select id="cat">
                            <option value="alimentacao">Alimentação</option>
                            <option value="lazer">Lazer</option>
                            <option value="transporte">Transporte</option>
                            <option value="saude">Saúde</option>
                            <option value="trabalho">Trabalho</option>
                            <option value="escola">Escola</option>
                            <option value="assinatura">Assinatura</option>
                            <option value="conta">Conta</option>
                            <option value="outro">Outro</option>
                        </select>
                    </td>
                </tr>
            </table>

            <br><br>
            <button type="submit" id="adicionar" onclick="adicionarGasto()">Adicionar Gasto</button>
        </form>
    </div>

    <hr>

    <div id="container2">
        <div id="ttl">AQUI SÓ VAI FICAR O VALOR GASTO</div>
    </div>

    <div id="container3">
        <h1>Lista de Gastos</h1>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
