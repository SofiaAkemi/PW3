<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos Pessoais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Meus Gastos Pessoais</h1>

        <h2>Adicionar Gasto</h2>

        <form action="" id="formulario">
            <table>
                <tr>
                    <td>
                        <label>Descrição</label><br>
                        <input type="text" id="desc"><br>
                    </td>
                    <td>
                        <label>Valor</label><br>
                        <input type="number" id="val"> <br>
                    </td>
                </tr>
            </table>

            <label>Operação</label>
            <br>
            <select id="cat">
                <option value="alimentacao">Alimentação</option>
                <option value="lazer">Lazer</option>
                <option value="transporte">Transporte</option>
                <option value="saude">Saúde</option>
                <option value="trabalho">Trabalho</option>
                <option value="escola">Escola</option>
                <option value="assinatura">Assinatura</option>
                <option value="contas">Contas</option>
                <option value="contas">Outro</option>
            </select>

            <br><br>
            <button type="submit" id="adicionar" onclick="adicionarGasto()">Adicionar Gasto</button>
        </form>

        <div id="resultado"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
