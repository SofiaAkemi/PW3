<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Controle de Vendas</h1>
    <div class="linha-principal">
        <div class="coluna1">
            <h2>Produto</h2>

            <div class="linha-produto">
                <input type="checkbox" id="bCh" name="bChocolate" value="Bolo de Chocolate">
                <label for="bCh">Bolo de Chocolate</label><br>
                <label>R$0,00</label><br>
                <input type="number" id="bChQt"><br>
            </div>

            <div class="linha-produto">
                <input type="checkbox" id="bBa" name="bBaunilha" value="Bolo de Baunilha">
                <label for="bBa">Bolo de Baunilha</label><br>
                <label>R$0,00</label><br>
                <input type="number" id="bBaQt"><br>
            </div>

            <div class="linha-produto">
                <input type="checkbox" id="bMo" name="bMorango" value="Bolo de Morango">
                <label for="bMo">Bolo de Morango</label><br>
                <label>R$0,00</label><br>
                <input type="number" id="bMoQt"><br>
            </div>

            <div class="linha-produto">
                <input type="checkbox" id="bCe" name="bCenoura" value="Bolo de Cenoura">
                <label for="bCe">Bolo de Cenoura</label><br>
                <label>R$0,00</label><br>
                <input type="number" id="bCeQt"><br>
            </div>

            <div class="linha-produto">
                <input type="checkbox" id="bFo" name="bFormigueiro" value="Bolo Formigueiro">
                <label for="bFo">Bolo Formigueiro</label><br>
                <label>R$0,00</label><br>
                <input type="number" id="bFoQt">
            </div>

            <div class="linha-produto">
                <input type="checkbox" id="bMi" name="bMilho" value="Bolo de Milho">
                <label for="bMi">Bolo de Milho</label><br>
                <label>R$0,00</label><br>
                <input type="number" id="bMiQt"><br>
            </div>

            <div class="linha-produto">
                <input type="checkbox" id="bMa" name="bMarmore" value="Bolo Mármore">
                <label for="bMa">Bolo Mármore</label><br>
                <label>R$0,00</label><br>
                <input type="number" id="bMaQt"><br>
            </div>

            <div class="linha-produto">
                <input type="checkbox" id="bLa" name="bLaranja" value="Bolo de Laranja">
                <label for="bLa">Bolo de Laranja</label><br>
                <label>R$0,00</label><br>
                <input type="number" id="bLaQt"><br>
            </div>

            <div class="linha-produto">
                <input type="checkbox" id="bLi" name="bLimao" value="Bolo de Limão">
                <label for="bLi">Bolo de Limão</label><br>
                <label>R$0,00</label><br>
                <input type="number" id="bLiQt"><br>
            </div>

            <div class="linha-produto">
                <input type="checkbox" id="bPa" name="bPacoca" value="Bolo de Paçoca">
                <label for="bPa">Bolo de Paçoca</label><br>
                <label>R$0,00</label><br>
                <input type="number" id="bPaQt"><br>
            </div>
        </div>
        <div class="coluna2">
            <h2>Pagamento</h2>

            <input type="radio" id="cre" name="credito" value="Crédito">
            <label for="cre">Crédito</label><br>
            <input type="radio" id="avi" name="avista" value="À Vista">
            <label for="avi">À Vista</label><br>

            <br>
            <label>Quantidade de parcelas: </label>
            <select id="parcelas">
                <option value="2p">2</option>
                <option value="3p">3</option>
                <option value="4p">4</option>
                <option value="50">5</option>
            </select>
        </div>
    </div>
</body>
</html>
