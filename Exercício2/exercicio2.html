<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Controle de Vendas</h1>
    <hr>
    <form>
        <div class="linha-principal">
            <div class="coluna1">
                <div class="linha-produto">
                    <div class="produto"><label class="ttl">Produto</label></div>
                    <div class="preco"><label class="ttl">Preço</label></div>
                    <div class="quantidade"><label class="ttl">Quantidade</label></div>
                </div>

                <br>

                <div class="linha-produto">
                    <div class="produto">
                        <input type="checkbox" id="bCh" name="bChocolate" value="Bolo de Chocolate">
                        <label for="bCh">Bolo de Chocolate</label>
                    </div>
                    <div class="preco"><label>R$20,00</label></div>
                    <div class="quantidade"><input type="number" id="bChQt"></div>
                </div>

                <div class="linha-produto">
                    <div class="produto">
                        <input type="checkbox" id="bBa" name="bBaunilha" value="Bolo de Baunilha">
                        <label for="bBa">Bolo de Baunilha</label>
                    </div>
                    <div class="preco"><label>R$20,00</label></div>
                    <div class="quantidade"><input type="number" id="bBaQt"></div>
                </div>

                <div class="linha-produto">
                    <div class="produto">
                        <input type="checkbox" id="bCe" name="bCenoura" value="Bolo de Cenoura">
                        <label for="bCe">Bolo de Cenoura</label>
                    </div>
                    <div class="preco"><label>R$30,00</label></div>
                    <div class="quantidade"><input type="number" id="bCeQt"></div>
                </div>

                <div class="linha-produto">
                    <div class="produto">
                        <input type="checkbox" id="bFo" name="bFormigueiro" value="Bolo Formigueiro">
                        <label for="bFo">Bolo Formigueiro</label>
                    </div>
                    <div class="preco"><label>R$25,00</label></div>
                    <div class="quantidade"><input type="number" id="bFoQt"></div>
                </div>

                <div class="linha-produto">
                    <div class="produto">
                        <input type="checkbox" id="bMi" name="bMilho" value="Bolo de Milho">
                        <label for="bMi">Bolo de Milho</label>
                    </div>
                    <div class="preco"><label>R$30,00</label></div>
                    <div class="quantidade"><input type="number" id="bMiQt"></div>
                </div>

                <div class="linha-produto">
                    <div class="produto">
                        <input type="checkbox" id="bLa" name="bLaranja" value="Bolo de Laranja">
                        <label for="bLa">Bolo de Laranja</label>
                    </div>
                    <div class="preco"><label>R$30,00</label></div>
                    <div class="quantidade"><input type="number" id="bLaQt"></div>
                </div>


                <div class="linha-produto">
                    <div class="produto">
                        <input type="checkbox" id="bPa" name="bPacoca" value="Bolo de Paçoca">
                        <label for="bPa">Bolo de Paçoca</label>
                    </div>
                    <div class="preco"><label>R$40,00</label></div>
                    <div class="quantidade"><input type="number" id="bPaQt"></div>
                </div>
            </div>
            <div class="coluna2">
                <label class="ttl">Pagamento</label>
                
                <div class="espaco"></div>

                <div class="opcao">
                    <input type="radio" id="cre" name="credito" value="Crédito">
                    <label for="cre">Crédito</label>
                </div>
                <div class="opcao">
                    <input type="radio" id="avi" name="avista" value="À Vista">
                    <label for="avi">À Vista</label>
                </div>

                <div class="parte">
                    <label>Quantidade de parcelas: </label>
                    <select id="parcelas">
                        <option value="2p">2</option>
                        <option value="3p">3</option>
                        <option value="4p">4</option>
                        <option value="50">5</option>
                    </select>
                </div>

                <div class="parte">
                <button type="submit">Calcular Lucro</button>
                </div>

                <div id="lucro">O lucro é de R$0,00.</div>
            </div>
        </div>
    </form>
</body>
</html>
